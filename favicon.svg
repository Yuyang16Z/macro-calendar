  <style>
    .t { fill: #176b75 } .g { stroke: #faf9f6 } .p { fill: #faf9f6 }
    @media (prefers-color-scheme: dark) { .t { fill: #12ccd8 } .g { stroke: #13191c } .p { fill: #13191c } }
  </style>
  <rect class="t" width="32" height="32" rx="9"/>
  <path class="g" d="M24.97 16.78A9 9 0 1 1 13.67 7.31" fill="none" stroke-width="3.2" stroke-linecap="round"/>
